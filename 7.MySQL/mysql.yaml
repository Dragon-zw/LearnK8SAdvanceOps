apiVersion: mysql.oracle.com/v2
kind: InnoDBCluster
metadata:
  name: mycluster
spec:
  imageRepository: ccr.ccs.tencentyun.com/course-share
  secretName: mypwds
  tlsUseSelfSigned: true
  instances: 3
  router:
    instances: 2
  datadirVolumeClaimTemplate:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
    storageClassName: managed-nfs-storage
  mycnf: |
    [mysqld]
    max_connections=1000
    lower_case_table_names=1
