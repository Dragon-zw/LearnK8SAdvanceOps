kubernetesClusterDomain: cluster.local
rocketmqOperator:
  manager:
    args:
    - --leader-elect
    containerSecurityContext:
      allowPrivilegeEscalation: false
    env:
      operatorName: rocketmq-operator
    image:
      repository: ccr.ccs.tencentyun.com/course-share/rocketmq-operator
      tag: latest
    imagePullPolicy: IfNotPresent
  replicas: 1
  serviceAccount:
    annotations: {}
